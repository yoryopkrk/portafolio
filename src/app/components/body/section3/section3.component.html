<section class="work-section" id="proyectos">
    <div class="container">
        <div class="section-heading">
            <p>Trabajo destacado</p>
            <h2>Áreas donde he aportado de punta a punta.</h2>
        </div>

        <div class="project-grid">
            <article class="project-card" *ngFor="let project of projectAreas">
                <h3>{{ project.title }}</h3>
                <p>{{ project.description }}</p>
                <div class="stack-list">
                    <span *ngFor="let item of project.stack">{{ item }}</span>
                </div>
            </article>
        </div>

        <div class="capabilities" id="habilidades">
            <div>
                <p class="section-kicker">Stack</p>
                <h2>Herramientas y tecnologías</h2>
                <div class="skill-list">
                    <span *ngFor="let skill of skills">{{ skill }}</span>
                </div>
            </div>

            <div class="education-card">
                <p class="section-kicker">Formación</p>
                <h3>Ingeniería en Informática</h3>
                <strong>Duoc UC · 2017 - 2020</strong>
                <div class="certifications">
                    <h4>Certificaciones y cursos</h4>
                    <ul>
                        <li *ngFor="let certification of certifications">{{ certification }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
