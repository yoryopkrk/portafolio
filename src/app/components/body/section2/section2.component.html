<section class="experience-section" id="experiencia">
    <div class="container">
        <div class="section-heading">
            <p>Experiencia</p>
            <h2>Trayectoria construyendo productos internos, reportes y automatizaciones.</h2>
        </div>

        <div class="timeline">
            <article class="experience-card" *ngFor="let experience of experiences">
                <div class="experience-card__meta">
                    <span>{{ experience.period }}</span>
                    <small>{{ experience.location }}</small>
                </div>
                <div class="experience-card__body">
                    <h3>{{ experience.role }}</h3>
                    <strong>{{ experience.company }}</strong>
                    <ul>
                        <li *ngFor="let bullet of experience.bullets">{{ bullet }}</li>
                    </ul>
                </div>
            </article>
        </div>
    </div>
</section>
