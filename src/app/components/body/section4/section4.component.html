<section class="contact-section" id="contacto">
    <div class="container">
        <div class="row g-4 align-items-start">
            <div class="col-lg-5">
                <p class="section-kicker">Contacto</p>
                <h2>Conversemos sobre una solución web, automatización o mejora interna.</h2>
                <div class="contact-info">
                    <a href="mailto:jor.sanchezv.90@gmail.com">
                        <fa-icon [icon]="faEnvelope"></fa-icon>
                        jor.sanchezv.90@gmail.com
                    </a>
                    <span>
                        <fa-icon [icon]="faPhone"></fa-icon>
                        Disponible para oportunidades y proyectos
                    </span>
                </div>
            </div>

            <div class="col-lg-7">
                <form class="contact-form" [formGroup]="submitForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="form-grid">
                        <label>
                            <span>Nombre</span>
                            <input type="text" class="form-control" formControlName="nombre" placeholder="Tu nombre">
                        </label>

                        <label>
                            <span>Correo</span>
                            <input type="email" class="form-control" formControlName="correo" placeholder="tu@email.com">
                        </label>

                        <label>
                            <span>Teléfono</span>
                            <input type="text" class="form-control" formControlName="telefono" placeholder="+56 9...">
                        </label>

                        <label>
                            <span>Mensaje</span>
                            <textarea class="form-control" formControlName="comentario" rows="5" placeholder="Cuentame que necesitas"></textarea>
                        </label>
                    </div>

                    <div class="form-actions">
                        <span class="message" [class.message--error]="huboError" *ngIf="mensaje">{{ mensaje }}</span>
                        <button type="submit" [disabled]="submitForm.invalid || cargando" class="btn btn-primary">
                            <fa-icon *ngIf="!cargando" [icon]="faArrowUpRightFromSquare"></fa-icon>
                            <fa-icon *ngIf="cargando" [icon]="faSpinner"></fa-icon>
                            Enviar mensaje
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
